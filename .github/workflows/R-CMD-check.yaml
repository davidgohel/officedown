on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 4AM every monday, to catch changes in pandoc or in dependencies
    - cron: '0 4 * * 1'
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, pandoc ${{ matrix.config.pandoc }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', pandoc: '3.8.3'}
          - {os: macOS-latest, r: 'release', pandoc: '3.8.3'}
          - {os: ubuntu-latest, r: 'devel', pandoc: '3.8.3'}
          - {os: ubuntu-latest, r: 'release', pandoc: 'latest'}
          - {os: ubuntu-latest, r: 'release', pandoc: '2.19'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # macOS runner images no longer ship XQuartz, but the RSPM binary of
      # gdtools is linked against /opt/X11/lib/libXrender.1.dylib.
      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ matrix.config.pandoc }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
